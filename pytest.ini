[pytest]
# Корень хранилища добавляется к путям поиска единиц ввоза.
#
# Без этой строки испытания находят движок лишь при запуске через
# `python -m pytest`, поскольку такой запуск добавляет текущую папку к путям
# сам. При запуске же командой `pytest` папка не добавляется, и всякое
# испытание обрывается сообщением о том, что единица `engine` не найдена.
# Строка устраняет различие, отчего оба способа запуска равносильны.
pythonpath = .

testpaths = tests
python_files = test_*.py
addopts = -q
